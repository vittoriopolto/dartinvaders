{% load static %}<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DartsInvaders{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600&display=swap">
  <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'home' %}">Darts<span>Invaders</span></a>
    <nav>
      <a href="{% url 'home' %}">Classifica</a>
      <a href="{% url 'fixture_list' %}">Partite</a>
      {% if user.is_authenticated %}
        <a href="{% url 'report_upload' %}">Carica referto</a>
        <form class="inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link">Esci</button></form>
      {% else %}
        <a href="{% url 'login' %}">Accedi</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for message in messages %}<div class="msg {{ message.tags }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
